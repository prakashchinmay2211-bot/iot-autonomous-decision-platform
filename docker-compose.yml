version: '3.8'

services:
  # 1. Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: iot_mosquitto_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # 2. Node-RED Visual IoT Workflow Engine
  nodered:
    image: nodered/node-red:latest
    container_name: iot_nodered_engine
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./node_red/flows.json:/data/flows.json
    depends_on:
      - mosquitto

  # 3. Grafana Enterprise Telemetry Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: iot_grafana_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  # 4. Streamlit Autonomous IoT Platform & ML Engine
  streamlit_app:
    build: .
    container_name: iot_autonomous_platform
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
